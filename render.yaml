# Render blueprint — client: Shreya Creation Boutique & Institute (root repo)
# STATIC SITE — no backend service block. This repo is a static frontend only.
# Do NOT copy this file into another client's repo — each client repo has its
# own Render service.

services:
  - type: static_site
    name: shreya-creation-boutique-institute
    runtime: node
    plan: free
    buildCommand: npm run build
    publishPath: .output/public
    branch: client/shreya-creation-boutique
    envVars:
      # BUG 4.4: env var names are CASE-SENSITIVE on Render — keep these EXACTLY
      # as written (same names in .env.example and the Render dashboard).
      - key: VITE_SHOP_NAME
        value: Shreya Creation Boutique & Institute
      - key: VITE_SHOP_TAGLINE
        value: Designer boutique, custom stitching & fashion designing institute in Patna
      - key: VITE_SHOP_FOUNDED_YEAR
        value: "2012"
      # Logo served from the repo public/ folder (absolute path — BUG 4.1)
      - key: VITE_SHOP_LOGO_PATH
        value: /favicon.ico
      # BUG 4.2: digits only + country code — no "+", no spaces.
      - key: VITE_WHATSAPP_NUMBER
        value: "919031105666"
      - key: VITE_INSTAGRAM_HANDLE
        value: "shreya.creationss"
      - key: VITE_CONTACT_EMAIL
        value: hello@shreyacreations.in
      - key: VITE_WEBSITE_URL
        value: https://shreyacreation.com
      # "Find us on Map" button target (BUG 4.7: empty => "Map coming soon")
      - key: VITE_GOOGLE_MAPS_URL
        value: https://www.google.com/maps/place/Shreya+creation+Boutique+Institute/@25.6103359,85.0998075,15z/data=!4m10!1m2!2m1!1sShreya+Creation!3m6!1s0x39ed583a14b55e6f:0x54c53b073707ea7e!8m2!3d25.6103359!4d85.1188619!15sCg9TaHJleWEgQ3JlYXRpb25aESIPc2hyZXlhIGNyZWF0aW9ukgEIYm91dGlxdWXgAQA!16s%2Fg%2F11st7djpls?entry=ttu&g_ep=EgoyMDI2MDkwOS4wIKXMDSoASAFQAw%3D%3D
      # Google Maps embed (iframe) URL — optional
      - key: VITE_GOOGLE_MAPS_EMBED_URL
        value: ""